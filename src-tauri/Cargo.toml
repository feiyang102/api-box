[package]
name = "api-box"
version = "0.1.0"
description = "API specification, testing and delivery workspace"
authors = ["API Box"]
edition = "2021"

[lib]
name = "api_box_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
